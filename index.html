<style>
  :root{
    --paper:#F6F2E9;--paper-dim:#EDE7D8;--blueprint:#355353;--blueprint-deep:#223838;--line:#8FB5B0;--amber:#D08A1E;--amber-soft:#E3A042;--amber-ink:#A8650A;--ink:#16211F;--ink-soft:#4F5F5D;--white:#FFFFFF;--green:#4C9A6B;--teal:#0E7C7B;--radius:2px;--max:1180px;--ease:cubic-bezier(.22,.9,.32,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth; scroll-padding-top:96px;}
  body{font-family:'IBM Plex Sans', sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}}
  h1,h2,h3,h4{font-family:'Space Grotesk', sans-serif; font-weight:600; letter-spacing:-0.01em; color:var(--blueprint);}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}
  section{padding:100px 0;}
  @media (max-width:720px){ section{padding:68px 0;} }
  ::selection{background:var(--amber); color:var(--ink);}
  :focus-visible{outline:2px solid var(--amber); outline-offset:3px;}
  .reveal{opacity:0; transform:translateY(26px); transition:opacity .7s var(--ease), transform .7s var(--ease);}
  .reveal.is-visible{opacity:1; transform:translateY(0);}
  .reveal-stagger.is-visible > *{opacity:1; transform:translateY(0);}
  .reveal-stagger > *{opacity:0; transform:translateY(20px); transition:opacity .6s var(--ease), transform .6s var(--ease);}
  .reveal-stagger.is-visible > *:nth-child(1){transition-delay:.05s;}
  .reveal-stagger.is-visible > *:nth-child(2){transition-delay:.14s;}
  .reveal-stagger.is-visible > *:nth-child(3){transition-delay:.23s;}
  .reveal-stagger.is-visible > *:nth-child(4){transition-delay:.32s;}
  .reveal-stagger.is-visible > *:nth-child(5){transition-delay:.41s;}
  .reveal-stagger.is-visible > *:nth-child(6){transition-delay:.5s;}
  .eyebrow{font-family:'IBM Plex Mono', monospace;font-size:12.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--blueprint);display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .eyebrow::before{content:""; width:26px; height:1px; background:var(--amber);}
  #scrollProgress{position:absolute; bottom:-1px; left:0; height:3px; background:var(--amber); width:0%; z-index:2; transition:width .1s linear;}
  header.site-nav{position:fixed; top:0; left:0; right:0; z-index:100;background:rgba(246,242,233,0.96);backdrop-filter:blur(6px);border-bottom:1px solid rgba(143,181,176,0.25);}
  .nav-inner{max-width:var(--max); margin:0 auto; padding:0 28px;height:88px; display:flex; align-items:center; justify-content:space-between;}
  .logo{display:flex; align-items:center; gap:2px; line-height:1;font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:19px; color:var(--blueprint-deep);}
  .logo-text{display:block; line-height:1; white-space:nowrap; margin-left:-4px; padding-top:2px;}
  .logo-img{height:72px; width:auto; display:block; object-fit:contain; flex-shrink:0;}
  @media (max-width:560px){ .logo-img{height:60px;} }
  nav.links{display:flex; align-items:center; gap:30px;}
  nav.links a{color:var(--blueprint-deep); font-size:14px; opacity:0.85; position:relative; padding:4px 0;}
  nav.links a:not(.cta)::after{content:""; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--amber);transition:width .2s var(--ease);}
  nav.links a:not(.cta):hover::after{width:100%;}
  nav.links a:hover{opacity:1;}
  nav.links a.cta{opacity:1; background:var(--amber); color:#fff; padding:9px 18px; border-radius:2px;font-weight:500; font-size:13.5px; transition:background .15s ease, transform .15s ease;}
  nav.links a.cta:hover{background:var(--amber-soft); transform:translateY(-1px);}
  .nav-toggle{display:none; background:none; border:none; color:var(--blueprint-deep); font-size:24px; cursor:pointer;}
  @media (max-width:900px){
    nav.links{position:fixed; top:88px; right:0; left:0; background:var(--paper);flex-direction:column; align-items:flex-start; gap:0; padding:8px 28px 20px;transform:translateY(-8px); opacity:0; pointer-events:none; transition:all .22s ease;border-bottom:1px solid rgba(143,181,176,0.25); max-height:80vh; overflow-y:auto;}
    nav.links.open{transform:translateY(0); opacity:1; pointer-events:auto;}
    nav.links a{width:100%; padding:13px 0; border-bottom:1px solid rgba(53,83,83,0.12);}
    nav.links a.cta{margin-top:10px; text-align:center;}
    .nav-toggle{display:block;}
  }
  .hero{background:var(--blueprint);color:var(--paper);padding:200px 0 100px;position:relative;overflow:hidden;background-image:linear-gradient(rgba(143,181,176,0.09) 1px, transparent 1px),linear-gradient(90deg, rgba(143,181,176,0.09) 1px, transparent 1px);background-size:34px 34px;background-position:center top;}
  .hero::before{content:""; position:absolute; inset:0; pointer-events:none;background:radial-gradient(600px 400px at 80% 10%, rgba(208,138,30,0.14), transparent 60%);}
  .hero-badge{display:inline-flex; align-items:center; gap:8px; padding:7px 14px;border:1px solid rgba(143,181,176,0.35); border-radius:20px;font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--line);margin-bottom:22px; animation:fadeUp .7s var(--ease) both;}
  .hero-badge .dot{width:6px; height:6px; border-radius:50%; background:var(--amber); animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(1.4);}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  .hero .wrap{display:grid; grid-template-columns:1.05fr 0.95fr; gap:50px; align-items:center; position:relative; z-index:1;}
  .hero h1{color:var(--paper); font-size:clamp(34px, 4.6vw, 56px); line-height:1.08; margin-bottom:22px;animation:fadeUp .8s var(--ease) .1s both;}
  .hero h1 em{font-style:normal; color:var(--amber); position:relative;}
  .hero p.lede{font-size:17.5px; color:#CFDDDA; max-width:46ch; margin-bottom:34px; animation:fadeUp .8s var(--ease) .22s both;}
  .hero-ctas{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:44px; animation:fadeUp .8s var(--ease) .34s both;}
  .btn{display:inline-flex; align-items:center; gap:8px;padding:13px 24px; border-radius:2px; font-size:14.5px; font-weight:500;border:1px solid transparent; cursor:pointer; transition:all .18s var(--ease);}
  .btn-primary{background:var(--amber); color:var(--ink);}
  .btn-primary:hover{background:var(--amber-soft); transform:translateY(-2px); box-shadow:0 8px 20px rgba(208,138,30,0.3);}
  .btn-ghost{border-color:rgba(246,242,233,0.35); color:var(--paper);}
  .btn-ghost:hover{border-color:var(--amber); color:var(--amber); transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .hero-meta{display:flex; gap:34px; flex-wrap:wrap; animation:fadeUp .8s var(--ease) .46s both;}
  .hero-meta .stat{font-family:'IBM Plex Mono', monospace;}
  .hero-meta .stat b{display:block; color:var(--amber); font-size:24px;}
  .hero-meta .stat span{font-size:11.5px; color:#A3BDB9; letter-spacing:.05em;}
  .blueprint-art{position:relative; animation:fadeUp .9s var(--ease) .2s both;}
  .blueprint-art svg{width:100%; height:auto; overflow:visible;}
  .draw-line{stroke-dasharray:600; stroke-dashoffset:600; animation:draw 2.2s var(--ease) forwards;}
  .draw-line.d1{animation-delay:.3s;}.draw-line.d2{animation-delay:.7s;}.draw-line.d3{animation-delay:1.1s;}.draw-line.d4{animation-delay:1.5s;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .float-tag{position:absolute; background:var(--paper); color:var(--blueprint); font-family:'IBM Plex Mono', monospace;font-size:11px; padding:6px 10px; border:1px solid var(--amber); border-radius:2px;animation:floaty 4s ease-in-out infinite;}
  .float-tag.t1{top:6%; right:-4%; animation-delay:0s;}
  .float-tag.t2{bottom:10%; left:-6%; animation-delay:1.4s;}
  @keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);}}
  @media (prefers-reduced-motion: reduce){ .draw-line{stroke-dashoffset:0; animation:none;} .float-tag{animation:none;} .hero-badge .dot{animation:none;} }
  @media (max-width:900px){.hero .wrap{grid-template-columns:1fr; text-align:left;}.hero{padding-top:150px;}.blueprint-art{order:-1; max-width:380px; margin-bottom:20px;}.float-tag{display:none;}}
  .section-head{max-width:640px; margin-bottom:52px;}
  .section-head.center{margin-left:auto; margin-right:auto; text-align:center;}
  .section-head.center .eyebrow{justify-content:center;}
  .section-head h2{font-size:clamp(26px,3.2vw,36px);}
  .section-head p{color:var(--ink-soft); margin-top:12px; font-size:15.5px;}
  .section-head p.eyebrow{margin-top:0;color:var(--blueprint);font-size:12.5px}
  .services{background:var(--paper);}
  .service-grid{display:grid; grid-template-columns:repeat(var(--n,4),1fr); gap:1px; background:rgba(53,83,83,0.18); border:1px solid rgba(53,83,83,0.18);}
  .service-card{background:var(--paper); padding:32px 26px; position:relative; transition:background .2s ease, transform .2s ease;}
  .service-card:hover{background:var(--white); transform:translateY(-4px); box-shadow:0 14px 30px rgba(53,83,83,0.1); z-index:1;}
  .service-card .sheet{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--amber-ink); margin-bottom:20px; display:block;}
  .service-card h3{font-size:18px; margin-bottom:10px;}
  .service-card p{font-size:14px; color:var(--ink-soft);}

  @media (max-width:560px){ .service-grid{grid-template-columns:1fr;} }
  .work{background:var(--paper-dim);}
  .work-grid{display:grid; grid-template-columns:repeat(var(--n,3),1fr); gap:22px;}
  .work-card{display:flex; flex-direction:column; padding:0; gap:0;background:var(--white); border-radius:6px; overflow:hidden;box-shadow:0 2px 8px rgba(53,83,83,0.12);transition:transform .25s var(--ease), box-shadow .25s ease;}
  .work-card:hover{transform:translateY(-6px); box-shadow:0 18px 36px rgba(53,83,83,0.22);}
  .work-title{display:block; margin:0; padding:15px 12px; text-align:center;background:var(--blueprint); color:#fff;font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:19px; line-height:1.2;transition:background .2s ease;}
  .work-card:hover .work-title{background:var(--amber-ink);}
  .work-shot{display:block; margin:0; padding:0; width:100%; aspect-ratio:16/10; overflow:hidden; background:var(--paper-dim);}
  .work-shot img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block; transition:transform .6s var(--ease);}
  .work-card:hover .work-shot img{transform:scale(1.04);}
  .work-foot{display:block; margin:0; padding:13px 12px; text-align:center;background:#404040; color:#fff; font-size:16px; font-weight:500;transition:background .2s ease;}
  .work-card:hover .work-foot{background:var(--ink);}
  @media (max-width:960px){ .work-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:620px){ .work-grid{grid-template-columns:1fr;} }
  .pricing{background:var(--paper);}
  .price-grid{display:grid; grid-template-columns:repeat(var(--n,4),1fr); gap:22px;}
  .price-card{background:var(--white); border:1px solid rgba(53,83,83,0.16); padding:32px 26px;display:flex; flex-direction:column; position:relative; transition:transform .25s var(--ease), box-shadow .25s ease, border-color .25s ease;}
  .price-card:hover{transform:translateY(-6px); box-shadow:0 20px 40px rgba(53,83,83,0.14); border-color:var(--amber);}
  .price-card.featured{border-color:var(--amber); background:var(--blueprint);}

  .price-card.featured .price-list li{color:#E4EDEB !important; opacity:1 !important;}
  .price-card.featured .price-period{color:#CFDDDA !important; opacity:1 !important;}
  .ribbon{position:absolute; top:-12px; left:26px; background:var(--amber); color:var(--ink);font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:4px 10px; letter-spacing:.06em;animation:pulse 2.4s ease-in-out infinite;}
  .price-sheet{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--amber-ink); margin-bottom:16px;}
  .price-card h3{font-size:19px; margin-bottom:6px;}
  .price-card > p.desc{font-size:13.5px; color:var(--ink-soft); margin-bottom:18px; min-height:38px;}

  .price-card .btn{justify-content:center; width:100%;}
  @media (max-width:960px){ .price-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .price-grid{grid-template-columns:1fr;} }
  .testimonials{background:var(--blueprint-deep); color:var(--paper); position:relative; overflow:hidden;}
  .testimonials .section-head p{color:#A3BDB9;}
  .testimonials .eyebrow{color:var(--line);}
  .testimonials .section-head h2{color:var(--paper)}
  .review-grid{display:grid; grid-template-columns:repeat(var(--n,3),1fr); gap:22px;}
  .review-card{background:rgba(246,242,233,0.04); border:1px solid rgba(143,181,176,0.2);padding:28px; transition:transform .25s var(--ease), border-color .25s ease, background .25s ease;}
  .review-card:hover{transform:translateY(-6px); border-color:var(--amber); background:rgba(246,242,233,0.07);}

  .review-who strong{display:block; font-size:14px; color:var(--paper);}

  @media (max-width:900px){ .review-grid{grid-template-columns:1fr; } }
